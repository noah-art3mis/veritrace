name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Supply-chain guard (the npm analog of judex-mini's uv exclude-newer):
      # fail the build on known high/critical-severity advisories in SHIPPED deps.
      # --omit=dev: dev-only tooling (e.g. the vitest UI server advisory GHSA-5xrq-8626-4rwp)
      # never runs in CI or production, so it shouldn't gate merges; prod deps are still audited
      # at the same high/critical threshold. See #84.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test
